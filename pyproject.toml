[project]
name = "finance-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "catchbishop53@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow==19.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
    "yfinance>=1.8.0",
]

[project.scripts]
finance-portfolio = "finance_portfolio:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
